services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: hubsoft_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel_db_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  pgdata_dev:
  